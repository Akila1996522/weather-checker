name: Github action pipeline

on:
  push:
    branches: ['develop']
  pull_request:
    branches: ['main']

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checking Repository
        uses: actions/checkout@v4
      
      - name: Setup Python Environment
        uses: actions/checkout@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 -r requirements.txt

      - name: Run flake8 (syntax and critical errors)
        run: |
          flake8 bin lib --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run flake8 (warnings, complexity, formatting)
        run: |
          flake8 bin lib --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
  
  golangci-lint:
    name: Run golangci-lint
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'  # or your preferred version

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.64.2
          config: .golangci.yml --out-format=colored-line-number --issues-exit-code=0

  test:
    runs-on: ubuntu-22.04
    needs: golangci-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  
      - run: |
          sudo apt-get update && sudo apt-get install -y libfreetype6-dev
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - run: pytest test/ --junitxml=junit/test-results.xml --cov=weather --cov-report=xml --cov-report=html

      
  build_push:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY_NAME }}:latest .
          docker push ${{ env.REGISTRY_NAME }}:latest
    env:
      REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
      REGISTRY: ${{ vars.REGISTRY }}

  deploy:
    runs-on: ubuntu-22.04
    needs: build_push
    steps:
      - uses: actions/checkout@v4
      - name: Add SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
      - name: Set Environment Name
        run: echo "CI_ENVIRONMENT_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Deploy to Server (Dev Environment)
        if: github.ref == 'refs/heads/develop'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/
            ./${{ env.DEPLOY_SCRIPT }} \
              -v "latest" \
              -a "${{ env.CONTAINER_TAG }}"
              -u "${{ env.DOCKER_USERNAME }}" \
              -p "${{ secrets.DOCKER_TOKEN }}" \
              -l "${{ env.DEPLOY_PATH }}" \
              -r "docker.io"
        env:
          CONTAINER_TAG: ${{ vars.CONTAINER_TAG }}
          REGISTRY_PATH: ${{ vars.REGISTRY_PATH }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SCRIPT: ${{ vars.DEPLOY_SCRIPT }}